name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22 🐧
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: 22

      - name: Build and test 🔧
        env:
          DISABLE_ESLINT_PLUGIN: true
          TSC_COMPILE_ON_ERROR: true
        run: |
          npm ci
          npm run build
          npm run coverage

      - name: Run ESLint and TypeScript checks 🚨
        run: |
          npm install @microsoft/eslint-formatter-sarif@2.1.7
          npx eslint src --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
          npx tsc --project .

      - name: Upload code coverage 🚀
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload analysis results to GitHub 🚀
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
